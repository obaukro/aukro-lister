<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aukro Lister</title>
  <link rel="stylesheet" href="vendor/tabulator.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Aukro Lister</strong>
      <span id="dataInfo" class="muted" data-i18n="loadingData">Načítám číselníky…</span>
    </div>
    <div class="actions">
      <label class="lang"><span data-i18n="language">Jazyk</span>
        <select id="uiLang"></select>
      </label>
      <button id="btnOpen" type="button" data-i18n="btnOpen">Otevřít práci</button>
      <button id="btnSave" type="button" data-i18n="btnSave">Uložit práci</button>
      <button id="btnImportCsv" type="button" data-i18n="btnImportCsv">Importovat CSV</button>
      <button id="btnExport" type="button" class="primary" data-i18n="btnExport">Exportovat CSV</button>
    </div>
  </header>

  <div id="demoBanner" class="banner" hidden data-i18n-html="demoBanner"></div>
  <div id="langNotice" class="banner" hidden></div>

  <details id="settingsBox" class="settings" open>
    <summary><span data-i18n="settingsTitle">Nastavení prodejce</span> <span id="settingsState" class="pill"></span></summary>
    <form id="settingsForm" class="settings-grid" autocomplete="off">
      <label><span data-i18n="domain">Účet na doméně</span>
        <select name="domain"></select>
      </label>
      <label><span data-i18n="city">Město</span>
        <input name="city">
      </label>
      <label><span data-i18n="postCode">PSČ</span>
        <input name="postCode">
      </label>
      <label><span data-i18n="country">Země</span>
        <select name="countryCode"></select>
      </label>
      <label><span data-i18n="shippingTemplate">ID šablony dopravy</span>
        <input name="shippingTemplateId" inputmode="numeric" data-i18n-placeholder="shippingPlaceholder">
        <small data-i18n="shippingHint">Moje Aukro → Můj prodej → Šablony dopravy.</small>
      </label>
      <label><span data-i18n="defaultDuration">Výchozí délka</span>
        <select name="defaultDuration"></select>
      </label>
      <label><span data-i18n="defaultReexpose">Výchozí opakování</span>
        <select name="defaultReexposeType"></select>
      </label>
    </form>
  </details>

  <nav class="tabs" id="viewTabs">
    <button type="button" class="tab" data-view="offers"><span data-i18n="tabOffers">Nabídky</span> <span id="tabOffersCount" class="muted"></span></button>
    <button type="button" class="tab" data-view="attrs"><span data-i18n="tabAttrs">Parametry</span> <span id="tabAttrsCount" class="muted"></span></button>
  </nav>

  <main id="sheet">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="btnAddRow" type="button" data-i18n="addRow">+ Řádek</button>
        <button id="btnAddRows" type="button" data-i18n="addRows">+ 10 řádků</button>
        <button id="btnSetCategory" type="button" data-i18n="setCategory">Kategorie pro označené</button>
        <button id="btnDelete" type="button" class="danger" data-i18n="deleteRows">Smazat označené řádky</button>
      </div>
      <div id="summary" class="summary"></div>
    </div>
    <div id="grid"></div>
    <p id="viewHint" class="hint muted"></p>
  </main>

  <dialog id="dlgCategory">
    <form method="dialog" class="dlg">
      <h2 data-i18n="chooseCategory">Vyberte kategorii</h2>
      <input id="catSearch" type="search" data-i18n-placeholder="searchCategory" autocomplete="off">
      <ul id="catList" class="cat-list"></ul>
      <div class="dlg-actions"><button value="cancel" data-i18n="close">Zavřít</button></div>
    </form>
  </dialog>

  <dialog id="dlgMessage">
    <form method="dialog" class="dlg">
      <h2 id="msgTitle"></h2>
      <div id="msgBody"></div>
      <div class="dlg-actions"><button value="ok" class="primary">OK</button></div>
    </form>
  </dialog>

  <input id="fileOpen" type="file" accept=".json,application/json" hidden>
  <input id="fileCsv" type="file" accept=".csv,text/csv" hidden>

  <script src="vendor/tabulator.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
