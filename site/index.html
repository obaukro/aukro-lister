<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aukro Lister</title>
  <link rel="stylesheet" href="vendor/tabulator.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Aukro Lister</strong>
      <span id="dataInfo" class="muted">Načítám číselníky…</span>
    </div>
    <div class="actions">
      <button id="btnOpen" type="button">Otevřít práci</button>
      <button id="btnSave" type="button">Uložit práci</button>
      <button id="btnImportCsv" type="button">Importovat CSV</button>
      <button id="btnExport" type="button" class="primary">Exportovat CSV</button>
    </div>
  </header>

  <div id="demoBanner" class="banner" hidden>
    Zobrazují se <strong>ukázková data</strong>. Skutečné kategorie a parametry se objeví po první synchronizaci s Aukrem.
  </div>

  <details id="settingsBox" class="settings" open>
    <summary>Nastavení prodejce <span id="settingsState" class="pill"></span></summary>
    <form id="settingsForm" class="settings-grid" autocomplete="off">
      <label>Účet na doméně
        <select name="domain"></select>
      </label>
      <label>Město
        <input name="city" placeholder="Ostrava">
      </label>
      <label>PSČ
        <input name="postCode" placeholder="702 00">
      </label>
      <label>Země
        <select name="countryCode"></select>
      </label>
      <label>ID šablony dopravy
        <input name="shippingTemplateId" inputmode="numeric" placeholder="např. 2419062">
        <small>Moje Aukro → Můj prodej → Šablony dopravy.</small>
      </label>
      <label>Výchozí délka
        <select name="defaultDuration"></select>
      </label>
      <label>Výchozí opakování
        <select name="defaultReexposeType"></select>
      </label>
    </form>
  </details>

  <nav class="tabs" id="viewTabs">
    <button type="button" class="tab" data-view="offers">Nabídky <span id="tabOffersCount" class="muted"></span></button>
    <button type="button" class="tab" data-view="attrs">Parametry <span id="tabAttrsCount" class="muted"></span></button>
  </nav>

  <main id="sheet">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="btnAddRow" type="button">+ Řádek</button>
        <button id="btnAddRows" type="button">+ 10 řádků</button>
        <button id="btnSetCategory" type="button">Kategorie pro označené</button>
        <button id="btnDelete" type="button" class="danger">Smazat označené řádky</button>
      </div>
      <div id="summary" class="summary"></div>
    </div>
    <div id="grid"></div>
    <p id="viewHint" class="hint muted"></p>
  </main>

  <!-- Výběr kategorie -->
  <dialog id="dlgCategory">
    <form method="dialog" class="dlg">
      <h2>Vyberte kategorii</h2>
      <input id="catSearch" type="search" placeholder="Hledat kategorii nebo ID…" autocomplete="off">
      <ul id="catList" class="cat-list"></ul>
      <div class="dlg-actions"><button value="cancel">Zavřít</button></div>
    </form>
  </dialog>

  <!-- Zprávy -->
  <dialog id="dlgMessage">
    <form method="dialog" class="dlg">
      <h2 id="msgTitle"></h2>
      <div id="msgBody"></div>
      <div class="dlg-actions"><button value="ok" class="primary">OK</button></div>
    </form>
  </dialog>

  <input id="fileOpen" type="file" accept=".json,application/json" hidden>
  <input id="fileCsv" type="file" accept=".csv,text/csv" hidden>

  <script src="vendor/tabulator.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
